<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

<div class="cabinet-container">

        <nav class="menu">

    <!-- ================= MAIN ================= -->

        <!-- ================= WELCOME ================= -->

        <section class="welcome-page">

            <div class="welcome-card">

                <div class="welcome-text">

                    <span class="welcome-label">

                    </span>

                    <h1>
                        Xush kelibsiz,
                        <span id="welcomeUserName">
                            ...

                    </h1>

                    <p>
                        Bolalar markazi boshqaruv paneliga xush kelibsiz.
                        Kerakli bo‘limni chap menyudan tanlang.
                    </p>

                </div>

                <div class="welcome-icon">
                    🏠
                </div>

            </div>


            <div class="quick-grid">

                <button class="quick-card" id="quickGroups">

                    <div class="quick-icon group-icon">
                        ▦
                    </div>

                    <div>
                        <strong>Guruhlar</strong>
                        <span>Guruhlarni ko‘rish</span>
                    </div>

                </button>


                <button class="quick-card" id="quickChildren">

                    <div class="quick-icon children-icon">
                        ♙
                    </div>

                    <div>
                        <strong>Bolalar</strong>
                        <span>Bolalar ro‘yxati</span>
                    </div>

                <button class="quick-card" id="quickTeachers">

                    </div>

                </button>


                <button class="quick-card" id="quickOthers">

                    <div class="quick-icon other-icon">
                        ◉

                        <strong>Boshqalar</strong>

</div>


<!-- ================= TOAST ================= -->

<div id="toast" class="toast"></div>


<!-- ================= CONFIRM MODAL ================= -->

<div id="confirmModal" class="modal-overlay">

    <div class="confirm-modal">

        <div class="confirm-icon">
            !
        </div>

        <h3 id="confirmText">
            Amalni tasdiqlaysizmi?
        </h3>

        <p>
            Ushbu amalni bajarishni tasdiqlang.
        </p>

        <div class="modal-actions">

            <button
                    class="btn btn-cancel"
                    id="noBtn">
                Bekor qilish
            </button>

            <button
                    class="btn btn-danger"
                    id="yesBtn">
                Tasdiqlash
            </button>

        </div>

    </div>

</div>


<script>

    /* =====================================================
       TOKEN
    ===================================================== */

    const accessToken = localStorage.getItem("accessToken");

    if (!accessToken) {
        window.location.href = "/auth/login.html";
    }


    /* =====================================================
       API
    ===================================================== */

    const API = {

        users: "/api/user",
        groups: "/api/group",
        children: "/api/children",
        others: "/api/others",
        roles: "/api/role"

    };


    /* =====================================================
       GLOBAL VARIABLES
    ===================================================== */

    let currentUserRoles = [];

    let currentPage = 0;

    const pageSize = 10;

    let currentUrl = "";

    let currentSection = "home";


    /* =====================================================
       JWT PAYLOAD
    ===================================================== */

    function getJwtPayload(token) {

        try {

            const base64Url = token.split(".")[1];

            const base64 = base64Url
                .replace(/-/g, "+")
                .replace(/_/g, "/");

            return JSON.parse(
                decodeURIComponent(
                    atob(base64)
                        .split("")
                        .map(function (c) {
                            return "%" +
                                ("00" + c.charCodeAt(0).toString(16))
                                    .slice(-2);
                        })
                        .join("")
                )
            );

        } catch (error) {

            console.warn("JWT payload o‘qilmadi.");

            return {};

        }

    }


    const jwtPayload = getJwtPayload(accessToken);


    /* =====================================================
       CURRENT USER
    ===================================================== */

    currentUserRoles = jwtPayload.roles || [];


    if (typeof currentUserRoles === "string") {

        currentUserRoles =
            currentUserRoles
                .split(",")
                .map(role => role.trim());

    }


    function getCurrentUserName() {

        return (
            jwtPayload.firstName ||
            jwtPayload.name ||
            "Foydalanuvchi"
        );

    }


    function isAdmin() {

        return (
            currentUserRoles.includes("ADMIN") ||
            currentUserRoles.includes("SUPER_ADMIN")
        );

    }


    /* =====================================================
       SET CURRENT USER
    ===================================================== */

    function setupCurrentUser() {

        const name = getCurrentUserName();

        const firstLetter =
            name.charAt(0).toUpperCase();

        document.getElementById("welcomeUserName")
            .textContent = name;

        document.getElementById("sidebarUserName")
            .textContent = name;

        document.getElementById("userAvatar")
            .textContent = firstLetter;


        const roleElement =
            document.getElementById("sidebarUserRole");

        if (currentUserRoles.length) {

            roleElement.textContent =
                currentUserRoles.join(", ");

        } else {

            roleElement.textContent =
                "Foydalanuvchi";

        }

    }


    setupCurrentUser();


    /* =====================================================
       FETCH WITH AUTH
    ===================================================== */

    async function fetchWithAuth(url, options = {}) {

        const headers = {
            ...(options.headers || {}),
            "Authorization": accessToken,
            "Content-Type": "application/json"
        };


        return fetch(url, {
            ...options,
            headers
        });

    }


    /* =====================================================
       TOAST
    ===================================================== */

    function showToast(message, type = "success") {

        const toast =
            document.getElementById("toast");

        toast.textContent = message;

        toast.className =
            "toast " + type;

        toast.classList.add("show");


        setTimeout(() => {

            toast.classList.remove("show");

        }, 2500);

    }


    /* =====================================================
       CONFIRM
    ===================================================== */

    function showConfirm(message, callback) {

        const modal =
            document.getElementById("confirmModal");

        const text =
            document.getElementById("confirmText");

        const yesBtn =
            document.getElementById("yesBtn");

        const noBtn =
            document.getElementById("noBtn");


        text.textContent = message;

        modal.classList.add("show");


        yesBtn.onclick = () => {

            modal.classList.remove("show");

            callback();

        };


        noBtn.onclick = () => {

            modal.classList.remove("show");

        };

    }


    /* =====================================================
       MENU ACTIVE
    ===================================================== */

    function setActiveMenu(id) {

        document
            .querySelectorAll(".menu-item")
            .forEach(item => {

                item.classList.remove("active");

            });


        const element =
            document.getElementById(id);

        if (element) {

            element.classList.add("active");

        }

    }


    /* =====================================================
       LOGOUT
    ===================================================== */

    document
        .getElementById("logoutBtn")
        .addEventListener("click", () => {

            localStorage.clear();

            window.location.href =
                "/auth/login.html";

        });


    /* =====================================================
       HOME
    ===================================================== */

    function loadHome() {

        currentSection = "home";

        setActiveMenu("homeBtn");


        document
            .getElementById("mainContent")
            .innerHTML = `

            <section class="welcome-page">

                <div class="welcome-card">

                    <div class="welcome-text">

                        <span class="welcome-label">
                            BOXCHA KABINET
                        </span>

                        <h1>
                            Xush kelibsiz,
                            <span>
                                ${escapeHtml(getCurrentUserName())}
                            </span>!
                        </h1>

                        <p>
                            Bolalar markazi boshqaruv paneliga
                            xush kelibsiz.
                            Kerakli bo‘limni chap menyudan tanlang.
                        </p>

                    </div>

                    <div class="welcome-icon">
                        🏠
                    </div>

                </div>


                <div class="quick-grid">

                    <button class="quick-card" id="quickGroups">
                        <div class="quick-icon group-icon">▦</div>
                        <div>
                            <strong>Guruhlar</strong>
                            <span>Guruhlarni ko‘rish</span>
                        </div>
                    </button>


                    <button class="quick-card" id="quickChildren">
                        <div class="quick-icon children-icon">♙</div>
                        <div>
                            <strong>Bolalar</strong>
                            <span>Bolalar ro‘yxati</span>
                        </div>
                    </button>


                    <button class="quick-card" id="quickTeachers">
                        <div class="quick-icon teacher-icon">♙</div>
                        <div>
                            <strong>Ustozlar</strong>
                            <span>Ustozlar ro‘yxati</span>
                        </div>
                    </button>


                    <button class="quick-card" id="quickOthers">
                        <div class="quick-icon other-icon">◉</div>
                        <div>
                            <strong>Boshqalar</strong>
                            <span>Xodimlar ro‘yxati</span>
                        </div>
                    </button>

                </div>

            </section>
        `;


        document
            .getElementById("quickGroups")
            .onclick = loadGroups;

        document
            .getElementById("quickChildren")
            .onclick = loadChildren;

        document
            .getElementById("quickTeachers")
            .onclick = loadTeachers;

        document
            .getElementById("quickOthers")
            .onclick = loadOthers;

    }


    document
        .getElementById("homeBtn")
        .onclick = loadHome;


    /* =====================================================
       GROUPS
    ===================================================== */

    document
        .getElementById("groupBtn")
        .onclick = loadGroups;


    async function loadGroups() {

        currentSection = "groups";

        setActiveMenu("groupBtn");


        document
            .getElementById("mainContent")
            .innerHTML = `

            <div class="page-header">

                <div>
                    <span class="page-label">
                        BOXCHA
                    </span>

                    <h1>Guruhlar</h1>

                    <p>
                        Markazdagi barcha guruhlar
                    </p>
                </div>

            </div>


            <div
                id="groupsBox"
                class="groups-grid">

                <div class="loading">
                    Yuklanmoqda...
                </div>

            </div>
        `;


        try {

            const response =
                await fetchWithAuth(API.groups);


            if (!response.ok) {

                throw new Error();

            }


            const groups =
                await response.json();


            renderGroups(groups);

        } catch (error) {

            document
                .getElementById("groupsBox")
                .innerHTML = `

                <div class="empty-state">
                    <div>⚠️</div>
                    <h3>Guruhlarni yuklab bo‘lmadi</h3>
                    <p>Server bilan bog‘lanishda xatolik.</p>
                </div>

                `;

        }

    }


    function renderGroups(groups) {

        const box =
            document.getElementById("groupsBox");


        if (!groups || !groups.length) {

            box.innerHTML = `

                <div class="empty-state">
                    <div>📭</div>
                    <h3>Guruhlar topilmadi</h3>
                    <p>Hozircha guruh mavjud emas.</p>
                </div>

            `;

            return;

        }


        box.innerHTML =
            groups.map(group => {



                return `

                <div
                    class="group-card"
                    data-id="${group.id}">

                    <div class="group-card-top">

                        <div class="group-icon-large">
                            ▦
                        </div>

                        <span class="group-arrow">
                            →
                        </span>

                    </div>


                    <h3>
                        ${escapeHtml(
                    group.groupName ||
                    group.name ||
                    "Nomsiz guruh"
                )}
                    </h3>




                </div>

                `;

            }).join("");


        document
            .querySelectorAll(".group-card")
            .forEach(card => {

                card.onclick = () => {

                    const id =
                        card.dataset.id;

                    loadGroupDetails(id);

                };

            });

    }


    /* =====================================================
       GROUP DETAILS
    ===================================================== */

    async function loadGroupDetails(groupId) {

        try {

            const response =
                await fetchWithAuth(
                    `${API.groups}/${groupId}`
                );


            if (!response.ok) {

                throw new Error();

            }


            const group =
                await response.json();


            showGroupModal(group);

        } catch (error) {

            showToast(
                "Guruh ma'lumotlarini yuklab bo‘lmadi",
                "error"
            );

        }

    }


    function showGroupModal(group) {

        const teacher =
            group.teacherFirstname
                ? `${group.teacherFirstname}
                   ${group.teacherLastname || ""}`
                : "Ustoz biriktirilmagan";


        const children =
            group.children || [];


        const modal =
            document.createElement("div");

        modal.className =
            "dynamic-modal";


        modal.innerHTML = `

            <div class="detail-modal">

                <button
                    class="modal-close">
                    ×
                </button>


                <div class="detail-header">

                    <div class="detail-avatar">
                        ▦
                    </div>

                    <div>

                        <span>GURUH</span>

                        <h2>
                            ${escapeHtml(
            group.groupName ||
            group.name ||
            "-"
        )}
                        </h2>

                    </div>

                </div>


                <div class="detail-grid">

                    <div class="detail-item">
                        <span>Ustoz</span>
                        <strong>
                            ${escapeHtml(teacher)}
                        </strong>
                    </div>


                    <div class="detail-item">
                        <span>Bolalar soni</span>
                        <strong>
                            ${children.length}
                        </strong>
                    </div>

                </div>


                ${
            isAdmin()
                ? `

                    <div class="modal-actions">

                        <button
                            class="btn btn-primary"
                            id="changeTeacherBtn">
                            👨‍🏫 Ustozni almashtirish
                        </button>

                    </div>

                    `
                : ""
        }

            </div>

        `;


        document.body.appendChild(modal);


        modal
            .querySelector(".modal-close")
            .onclick = () => modal.remove();


        if (isAdmin()) {

            modal
                .querySelector("#changeTeacherBtn")
                .onclick = () => {

                modal.remove();

                showChangeTeacherModal(group);

            };

        }

    }


    /* =====================================================
       CHANGE GROUP TEACHER
    ===================================================== */

    async function showChangeTeacherModal(group) {

        try {

            const response =
                await fetchWithAuth(API.users);


            if (!response.ok) {

                throw new Error();

            }


            const users =
                await response.json();


            const teachers =
                users.filter(user => {

                    return user.roles?.some(role =>
                        String(role.role)
                            .toUpperCase()
                            .includes("TEACHER")
                    );

                });


            const modal =
                document.createElement("div");

            modal.className =
                "dynamic-modal";


            modal.innerHTML = `

                <div class="form-modal">

                    <button class="modal-close">
                        ×
                    </button>

                    <h2>
                        Ustozni almashtirish
                    </h2>

                    <p class="modal-subtitle">
                        Guruh:
                        <strong>
                            ${escapeHtml(
                group.groupName ||
                group.name ||
                "-"
            )}
                        </strong>
                    </p>


                    <label>
                        Ustoz
                    </label>

                    <select id="teacherSelect">

                        <option value="">
                            Ustoz tanlang
                        </option>

                        ${teachers.map(teacher => `

                            <option value="${teacher.id}">
                                ${escapeHtml(
                teacher.firstName
            )}
                                ${escapeHtml(
                teacher.lastName
            )}
                            </option>

                        `).join("")}

                    </select>


                    <div class="modal-actions">

                        <button
                            class="btn btn-cancel"
                            id="cancelTeacher">
                            Bekor qilish
                        </button>

                        <button
                            class="btn btn-primary"
                            id="saveTeacher">
                            Saqlash
                        </button>

                    </div>

                </div>

            `;


            document.body.appendChild(modal);


            modal.querySelector(".modal-close")
                .onclick = () => modal.remove();


            modal.querySelector("#cancelTeacher")
                .onclick = () => modal.remove();


            modal.querySelector("#saveTeacher")
                .onclick = async () => {

                const teacherId =
                    document.getElementById(
                        "teacherSelect"
                    ).value;


                if (!teacherId) {

                    showToast(
                        "Ustoz tanlang",
                        "error"
                    );

                    return;

                }


                /*
                 * Backenddagi group teacher
                 * endpointi shu yerga ulanadi.
                 *
                 * Hozircha:
                 */

                showToast(
                    "Ustozni almashtirish API endpointi backenddan kerak",
                    "error"
                );

            };

        } catch (error) {

            showToast(
                "Ustozlarni yuklab bo‘lmadi",
                "error"
            );

        }

    }


    /* =====================================================
       CHILDREN
    ===================================================== */

    document
        .getElementById("childrenBtn")
        .onclick = loadChildren;


    async function loadChildren() {

        currentSection = "children";

        currentPage = 0;

        setActiveMenu("childrenBtn");


        document
            .getElementById("mainContent")
            .innerHTML = `

            <div class="page-header">

                <div>
                    <span class="page-label">
                        BOXCHA
                    </span>

                    <h1>Bolalar</h1>

                    <p>
                        Bolalar ro‘yxati va ma'lumotlari
                    </p>
                </div>


                ${
            isAdmin()
                ? `
                    <button
                        class="btn btn-primary"
                        id="addChildBtn">
                        + Yangi bola
                    </button>
                    `
                : ""
        }

            </div>


            <div class="filter-panel">

                <div class="filter-status">

                    <button
                        class="filter-btn active"
                        data-status="all"
                        id="childrenAll">
                        Barchasi
                    </button>

                    <button
                        class="filter-btn"
                        data-status="true"
                        id="childrenActive">
                        Faol
                    </button>

                    <button
                        class="filter-btn"
                        data-status="false"
                        id="childrenInactive">
                        Nofaol
                    </button>

                </div>


                <div class="filter-search">

                    <input
                        type="text"
                        id="childFirstName"
                        placeholder="Ism">


                    <input
                        type="text"
                        id="childLastName"
                        placeholder="Familiya">


                    <select id="childGroupFilter">

                        <option value="">
                            Barcha guruhlar
                        </option>

                    </select>


                    <button
                        class="btn btn-primary"
                        id="childSearchBtn">
                        🔎 Qidirish
                    </button>

                </div>

            </div>


            <div id="childrenTableBox"
                 class="table-container">

                <div class="loading">
                    Yuklanmoqda...
                </div>

            </div>

        `;


        await loadChildGroupsFilter();

        attachChildrenFilters();

        if (isAdmin()) {

            document
                .getElementById("addChildBtn")
                .onclick = showAddChildModal;

        }


        await fetchChildren();

    }


    async function loadChildGroupsFilter() {

        try {

            const response =
                await fetchWithAuth(API.groups);


            if (!response.ok) return;


            const groups =
                await response.json();


            const select =
                document.getElementById(
                    "childGroupFilter"
                );


            groups.forEach(group => {

                const option =
                    document.createElement("option");

                option.value =
                    group.id;

                option.textContent =
                    group.groupName ||
                    group.name;

                select.appendChild(option);

            });

        } catch (error) {

            console.warn(
                "Guruh filterini yuklashda xatolik"
            );

        }

    }


    function attachChildrenFilters() {

        document
            .getElementById("childrenAll")
            .onclick = () => {

            setChildrenFilterActive(
                "childrenAll"
            );

            fetchChildren();

        };


        document
            .getElementById("childrenActive")
            .onclick = () => {

            setChildrenFilterActive(
                "childrenActive"
            );

            fetchChildren(true);

        };


        document
            .getElementById("childrenInactive")
            .onclick = () => {

            setChildrenFilterActive(
                "childrenInactive"
            );

            fetchChildren(false);

        };


        document
            .getElementById("childSearchBtn")
            .onclick = () => {

            fetchChildren();

        };

    }


    function setChildrenFilterActive(id) {

        document
            .querySelectorAll(".filter-status .filter-btn")
            .forEach(btn =>
                btn.classList.remove("active")
            );


        document
            .getElementById(id)
            .classList.add("active");

    }


    async function fetchChildren(status = null) {

        const firstName =
            document
                .getElementById("childFirstName")
                ?.value
                .trim();


        const lastName =
            document
                .getElementById("childLastName")
                ?.value
                .trim();


        const groupId =
            document
                .getElementById("childGroupFilter")
                ?.value;


        let url =
            API.children;


        const params =
            new URLSearchParams();


        if (status !== null) {

            params.append(
                "active",
                status
            );

        }


        if (firstName) {

            params.append(
                "firstName",
                firstName
            );

        }


        if (lastName) {

            params.append(
                "lastName",
                lastName
            );

        }


        if (groupId) {

            params.append(
                "groupId",
                groupId
            );

        }


        params.append(
            "page",
            currentPage
        );


        params.append(
            "size",
            pageSize
        );


        if (params.toString()) {

            url += "?" + params.toString();

        }


        currentUrl = url;


        try {

            const response =
                await fetchWithAuth(url);


            if (!response.ok) {

                throw new Error();

            }


            const children =
                await response.json();


            renderChildren(children);


        } catch (error) {

            document
                .getElementById(
                    "childrenTableBox"
                )
                .innerHTML = `

                <div class="empty-state">
                    <div>⚠️</div>
                    <h3>Bolalarni yuklab bo‘lmadi</h3>
                    <p>API bilan bog‘lanishda xatolik.</p>
                </div>

                `;

        }

    }


    function renderChildren(children) {

        const box =
            document.getElementById(
                "childrenTableBox"
            );


        if (!children.length) {

            box.innerHTML = `

                <div class="empty-state">
                    <div>👶</div>
                    <h3>Bolalar topilmadi</h3>
                    <p>
                        Tanlangan filter bo‘yicha
                        ma'lumot topilmadi.
                    </p>
                </div>

            `;

            return;

        }


        box.innerHTML = `

            <div class="table-wrapper">

                <table>

    async function fetchTeachers(active = null) {

        let url =
            API.users;


        const params =
            new URLSearchParams();


        const firstName =
            document
                .getElementById(
                    "teacherFirstName"
                )
                ?.value
                .trim();


        const lastName =
            document
                .getElementById(
                    "teacherLastName"
                )
                ?.value
                .trim();


        if (active !== null) {

            params.append(
                "active",
                active
            );

        }


        if (firstName) {

            params.append(
                "firstName",
                firstName
            );

        }


        if (lastName) {

            params.append(
                "lastName",
                lastName
            );

        }


        params.append(
            "page",
            currentPage
        );


        params.append(
            "size",
            pageSize
        );


        url += "?" + params.toString();


        try {

            const response =
                await fetchWithAuth(url);


            if (!response.ok) {

                throw new Error();

            }


            const users =
                await response.json();


            renderTeachers(users);

        } catch (error) {

            document
                .getElementById(
                    "teachersTableBox"
                )
                .innerHTML = `

                <div class="empty-state">

                    <div>⚠️</div>

                    <h3>
                        Ustozlarni yuklab bo‘lmadi
                    </h3>

                </div>

                `;

        }

    }

    async function fetchOthers(active = null) {

        let url =
            API.others;


        const params =
            new URLSearchParams();


        const firstName =
            document
                .getElementById(
                    "otherFirstName"
                )
                ?.value
                .trim();


        const lastName =
            document
                .getElementById(
                    "otherLastName"
                )
                ?.value
                .trim();


        if (active !== null) {

            params.append(
                "active",
                active
            );

        }


        if (firstName) {

            params.append(
                "firstName",
                firstName
            );

        }


        if (lastName) {

            params.append(
                "lastName",
                lastName
            );

        }


        params.append(
            "page",
            currentPage
        );


        params.append(
            "size",
            pageSize
        );


        url += "?" + params.toString();


        try {

            const response =
                await fetchWithAuth(url);


            if (!response.ok) {

                throw new Error();

            }


            const others =
                await response.json();


            renderOthers(others);

        } catch (error) {

            document
                .getElementById(
                    "othersTableBox"
                )
                .innerHTML = `

                <div class="empty-state">
                    <div>⚠️</div>
                    <h3>
                        Ma'lumotlarni yuklab bo‘lmadi
                    </h3>
                </div>

                `;

        }

    }


    function renderOthers(others) {

        const box =
            document.getElementById(
                "othersTableBox"
            );


        if (!others.length) {

            box.innerHTML = `

                <div class="empty-state">

                    <div>👤</div>

                    <h3>
                        Xodimlar topilmadi
                    </h3>

                </div>

            `;

            return;

        }


        box.innerHTML = `

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>Ism</th>
                            <th>Familiya</th>
                            <th>Kasbi</th>
                            <th>Status</th>

                        </tr>

                    </thead>


                    <tbody>

                        ${others.map(other => `

                        `).join("")}

                    </tbody>

                </table>

            </div>


            <div class="pagination">

                <button
                    class="btn btn-secondary"
                    id="otherPrev"
                    ${currentPage === 0
            ? "disabled"
            : ""}>
                    ← Oldingi
                </button>


                <span>
                    ${currentPage + 1}-sahifa

                <button

        document

                row.onclick = () =>
                    showOtherDetails(

                    );

            });


        document
            .getElementById("otherPrev")
            .onclick = () => {

            currentPage--;

            fetchOthers();

        };


        document
            .getElementById("otherNext")
            .onclick = () => {

            currentPage++;

            fetchOthers();

        };

    }

                <div class="form-grid">

                    <div class="form-field">

                        <label>
                            Ism
                        </label>

                        <input
                            id="editOtherFirstName"
                            value="${escapeAttribute(
            other.firstName
        )}">

                    </div>


                    <div class="form-field">

                        <label>
                            Familiya
                        </label>

                        <input
                            id="editOtherLastName"
                            value="${escapeAttribute(
            other.lastName
        )}">

                    </div>


                    <div class="form-field">

                        <label>
                            Telefon
                        </label>

                        <input
                            id="editOtherPhone"
                            value="${escapeAttribute(
            other.phone || ""
        )}">

                    </div>


                    <div class="form-field">

                        <label>
                            Kasbi
                        </label>

                        <input
                            id="editOtherProfession"
                            value="${escapeAttribute(
            other.profession || ""
        )}">

                    </div>

                </div>


                <div class="modal-actions">

                    <button
                        class="btn btn-cancel"
                        onclick="this.closest('.dynamic-modal').remove()">
                        Bekor qilish
                    </button>


                    <button
                        class="btn btn-primary"
                        id="updateOtherBtn">
                        Saqlash
                    </button>

                </div>

            </div>

        `;


        document.body.appendChild(modal);


        modal.querySelector(".modal-close")
            .onclick = () => modal.remove();


        modal
            .querySelector("#updateOtherBtn")
            .onclick = async () => {

            const data = {

                firstName:
                    document
                        .getElementById(
                            "editOtherFirstName"
                        )
                        .value.trim(),

                lastName:
                    document
                        .getElementById(
                            "editOtherLastName"
                        )
                        .value.trim(),

                phone:
                    document
                        .getElementById(
                            "editOtherPhone"
                        )
                        .value.trim(),

                profession:
                    document
                        .getElementById(
                            "editOtherProfession"
                        )
                        .value.trim()

            };


            try {

                const response =
                    await fetchWithAuth(
                        `${API.others}/${other.id}`,
                        {
                            method: "PUT",
                            body: JSON.stringify(data)
                        }
                    );


                if (!response.ok) {

                    throw new Error();

                }


                modal.remove();

                showToast(
                    "Ma'lumotlar o‘zgartirildi"
                );


                loadOthers();

            } catch (error) {

                showToast(
                    "O‘zgartirishda xatolik",
                    "error"
                );

            }

        };

    }


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHtml(value) {

        if (value === null ||
            value === undefined) {

            return "";

        }


        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    function escapeAttribute(value) {

        return escapeHtml(value);

    }


    /* =====================================================
       QUICK BUTTONS
    ===================================================== */

    document
        .getElementById("quickGroups")
        .onclick = loadGroups;


    document
        .getElementById("quickChildren")
        .onclick = loadChildren;


    document
        .getElementById("quickTeachers")
        .onclick = loadTeachers;


    document
        .getElementById("quickOthers")
        .onclick = loadOthers;


</script>

</body>
</html>
