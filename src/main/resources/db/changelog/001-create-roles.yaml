databaseChangeLog:

  - changeSet:
      id: 001-create-roles-table
      author: boxcha

      changes:

        - createTable:
            tableName: roles

            columns:

              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP

              - column:
                  name: update_at
                  type: TIMESTAMP

              - column:
                  name: role
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

  - changeSet:
      id: 001-create-roles-data
      author: boxcha

      changes:

        - insert:
            tableName: roles
            columns:

              - column:
                  name: role
                  value: ADMIN

              - column:
                  name: is_active
                  valueBoolean: true

              - column:
                  name: created_at
                  valueDate: "2026-09-09T00:00:00"

              - column:
                  name: update_at
                  valueDate: "2026-09-09T00:00:00"

        - insert:
            tableName: roles
            columns:

              - column:
                  name: role
                  value: TEACHER

              - column:
                  name: is_active
                  valueBoolean: true

              - column:
                  name: created_at
                  valueDate: "2026-09-09T00:00:00"

              - column:
                  name: update_at
                  valueDate: "2026-09-09T00:00:00"

        - insert:
            tableName: roles
            columns:

              - column:
                  name: role
                  value: DOCTOR

              - column:
                  name: is_active
                  valueBoolean: true

              - column:
                  name: created_at
                  valueDate: "2026-09-09T00:00:00"

              - column:
                  name: update_at
                  valueDate: "2026-09-09T00:00:00"

  - changeSet:
      id: 001-role-unique
      author: boxcha

      changes:

        - addUniqueConstraint:
            tableName: roles
            columnNames: role
            constraintName: uk_roles_role