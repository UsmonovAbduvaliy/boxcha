databaseChangeLog:

  - changeSet:
      id: 004-create-default-admin
      author: boxcha

      changes:

        - insert:
            tableName: users

            columns:

              - column:
                  name: email
                  value: admin@gmail.com

              - column:
                  name: password
                  value: "$2a$10$LhFcdvlEENekvdaizavFz.ybaXhTOGeJxDBk6LUZx4acwQcgPnVBu"

              - column:
                  name: first_name
                  value: Admin

              - column:
                  name: last_name
                  value: Admin

              - column:
                  name: phone
                  value: null

              - column:
                  name: is_active
                  valueBoolean: true

              - column:
                  name: created_at
                  valueDate: "2026-09-09T00:00:00"

              - column:
                  name: update_at
                  valueDate: "2026-09-09T00:00:00"

        - sql:
            sql: |
              INSERT INTO users_roles (users_id, roles_id)
              SELECT u.id, r.id
              FROM users u
              JOIN roles r ON r.role = 'ADMIN'
              WHERE u.email = 'admin@gmail.com';