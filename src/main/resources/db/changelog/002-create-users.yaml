databaseChangeLog:

  - changeSet:
      id: 002-create-users-table
      author: boxcha

      changes:

        - createTable:
            tableName: users

            columns:

              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP

              - column:
                  name: update_at
                  type: TIMESTAMP

              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: first_name
                  type: VARCHAR(255)

              - column:
                  name: last_name
                  type: VARCHAR(255)

              - column:
                  name: phone
                  type: VARCHAR(255)

  - changeSet:
      id: 002-users-email-unique
      author: boxcha

      changes:

        - addUniqueConstraint:
            tableName: users
            columnNames: email
            constraintName: uk_users_email